<!doctype html>
<html lang="ru" data-theme="winter">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Официальный сайт межуниверситетского объединения студенческих инициатив «Новая Орбита»"
    />
    <title>Новая Орбита</title>
    <script>
      try {
        var t = localStorage.getItem("novaya-orbita.theme");
        if (t === "winter" || t === "blue" || t === "pink" || t === "green") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
